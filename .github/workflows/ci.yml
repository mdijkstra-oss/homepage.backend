# Quality gate — GitHub Actions.
#
# Chancery is what serves this repository and it carries its own test suite, so
# what is left to check here is the configuration. `validate` resolves the model
# alias, confirms every include exists and reports orphaned Markdown, and it runs
# inside the built image so what is exercised is what ships.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      IMAGE: homepage-backend:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag "$IMAGE" .

      - name: Validate configuration
        run: docker run --rm "$IMAGE" validate
