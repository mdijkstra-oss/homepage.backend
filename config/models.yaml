models:
  # The prefix is how dragoman picks a provider: it splits on the first slash,
  # keeps `scaleway` for itself and asks that endpoint for the rest. Scaleway
  # serves this id on /chat/completions, which chancery does not speak — the
  # translation is the reason dragoman is in the path at all.
  fast:
    model: scaleway/deepseek-v4-flash-0731
